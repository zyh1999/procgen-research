# Integration-only configuration. Formal A/B/C/D configs remain 6M and matched.
algo: adv

algo_config:
  variant_name: SMOKE_D_phasic_critic_ggn_actor_fisher_clip
  ent_coef: 0.0
  norm_obj: adv
  optimizer: sgd
  optimizer_momentum: 0.0
  is_kaczmarz: false
  lr: 0.004
  adaptive_lr_max: 0.5
  use_kl_adaptive_lr: true
  adaptive_kl_mode: procgen_rollout
  adaptive_kl_lower: 0.005
  adaptive_kl_upper: 0.04
  adaptive_lr_min: 0.0001
  epochs: 1
  minibatches: 8
  vf_coef: 1.0
  with_popart: true
  adv_type: gae
  clamp_ratio: true
  max_ratio: 10.0
  min_ratio: 0.1
  sigma_type: vector
  cg_damping: 0.5
  linear_solve_dtype: float64
  max_grad_norm: 0.5
  separate_policy_critic_steps: true
  use_phasic_training: true
  use_critic_ggn_auxiliary: true
  use_actor_fisher_aux_clip: true
  use_full_gradient_anchor_curvature: false
  use_joint_2b_auxiliary_system: false
  use_gaussian_critic_sampling: false
  policy_updates_per_cycle: 1
  auxiliary_steps_per_cycle: 1
  aux_store_per_policy_update: 64
  aux_batch_size: 16
  actor_fisher_batch_size: 32
  critic_ggn_damping: 0.01
  aux_learning_rate: 0.01
  actor_target_kl: 0.01
  jacobian_chunk_size: 8
  cholesky_max_retries: 5
  cholesky_damping_multiplier: 10.0

env_config:
  env_name: bigfish-easy-0-10
  num_envs: 16
  nsteps: 256
  norm_ret: false
  timesteps_per_proc_easy: 0
  timesteps_per_proc_hard: 0

nets_config:
  type: resnet
  norm_obs: false
  with_bn: false
  dropout: 0.0
  hidden_size: 256

log_config:
  log_interval: 1
  n_eval_trials: 20
