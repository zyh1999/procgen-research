algo: adv

algo_config:
  ent_coef: 0.0
  norm_obj: adv
  optimizer: sgd
  lr: 0.5
  use_kl_adaptive_lr: true
  use_procgen_kl_thresholds: true
  is_karzmarz: false
  epochs: 4
  minibatches: 8
  vf_coef: 1.0
  with_popart: true
  adv_type: gae
  clamp_ratio: true
  max_ratio: 10.0
  min_ratio: 0.1
  sigma_type: vector
  cg_damping: 0.5
  max_grad_norm: 0.5

env_config:
  env_name: dodgeball-easy-0-10
  num_envs: 16
  nsteps: 256
  norm_ret: false
  timesteps_per_proc: 10_000_000
  timesteps_per_proc_easy: 6_000_000
  timesteps_per_proc_hard: 100_000_000

nets_config:
  type: resnet
  norm_obs: false
  with_bn: false
  dropout: 0.0
  hidden_size: 256

log_config:
  log_interval: 10
  n_eval_trials: 20
