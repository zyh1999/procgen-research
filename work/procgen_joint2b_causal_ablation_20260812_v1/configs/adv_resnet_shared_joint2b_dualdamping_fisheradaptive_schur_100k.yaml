algo: adv

algo_config:
  ent_coef: 0.0
  norm_obj: adv
  optimizer: sgd
  optimizer_momentum: 0.0
  is_kaczmarz: false
  lr: 0.004
  adaptive_lr_max: 0.02
  use_kl_adaptive_lr: true
  adaptive_kl_mode: procgen_rollout
  adaptive_kl_lower: 0.005
  adaptive_kl_upper: 0.04
  adaptive_lr_min: 0.0001
  epochs: 4
  minibatches: 8
  vf_coef: 1.0
  joint_ablation_mode: full_joint
  joint_critic_objective_coef: 1.0
  joint_critic_curvature_coef: 1.0
  joint_critic_score_mode: clean
  joint_critic_rhs_mode: paired_score_residual
  joint_critic_param_scope: all
  causal_diagnostic_interval: 32
  with_popart: true
  adv_type: gae
  clamp_ratio: true
  max_ratio: 10.0
  min_ratio: 0.1
  sigma_type: vector
  cg_damping: 0.5
  joint_actor_base_damping: 0.5
  joint_critic_base_damping: 0.5
  joint_damping_mode: block_median_floor
  joint_damping_to_median_floor: 0.10
  joint_actor_damping_from_critic_floor: 0.01
  joint_fisher_adaptive_block_damping: true
  joint_fisher_adaptive_high: 0.85
  joint_fisher_adaptive_low: 0.50
  joint_fisher_adaptive_actor_base_min: 0.03
  joint_fisher_adaptive_median_floor_min: 0.01
  joint_fisher_adaptive_critic_guard_min: 0.0
  joint_diagonal_damping_floor: 0.0
  joint_linear_solver: schur_critic_b
  schur_equivalence_diagnostic_interval: 32
  linear_solve_dtype: float64
  max_grad_norm: 0.5

env_config:
  env_name: bigfish-easy-0-10
  num_envs: 16
  nsteps: 256
  norm_ret: false
  timesteps_per_proc_easy: 100_000
  timesteps_per_proc_hard: 100_000_000

nets_config:
  type: resnet
  norm_obs: false
  with_bn: false
  dropout: 0.0
  hidden_size: 256
  decision_hidden_size: 1024

log_config:
  log_interval: 10
  n_eval_trials: 20
