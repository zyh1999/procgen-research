algo: adv

algo_config:
  ent_coef: 0.0
  norm_obj: adv
  optimizer: sgd
  optimizer_momentum: 0.0
  is_kaczmarz: false
  lr: 0.004
  # The original Paper RAT leaves a much wider LR ceiling.  The previous
  # deterministic run saturated at 0.02 in low-KL environments, so retain the
  # same KL feedback but remove that artificial ceiling for this causal gate.
  adaptive_lr_max: 0.5
  use_kl_adaptive_lr: true
  adaptive_kl_mode: procgen_rollout
  adaptive_kl_lower: 0.005
  adaptive_kl_upper: 0.04
  adaptive_lr_min: 0.0001
  epochs: 4
  minibatches: 8
  vf_coef: 1.0

  # Strict deterministic 2B x 2B metric with complete actor/critic cross
  # blocks.  Only the objective reconstruction semantics are aligned with the
  # original RAT: advantage and unit critic pseudo-advantage are solved as two
  # RHS columns, while the critic residual weights reconstruction after solve.
  joint_ablation_mode: full_joint
  joint_critic_objective_coef: 1.0
  joint_critic_curvature_coef: 1.0
  joint_critic_score_mode: clean
  joint_critic_rhs_mode: paper_weight_residual_reconstruct
  joint_reconstruction_mode: paper_selective
  joint_critic_param_scope: all
  joint_critic_reconstruction_scope: all
  causal_diagnostic_interval: 32

  with_popart: true
  adv_type: gae
  clamp_ratio: true
  max_ratio: 10.0
  min_ratio: 0.1
  sigma_type: vector
  cg_damping: 0.5
  joint_damping_mode: block_median_floor
  joint_damping_to_median_floor: 0.1
  joint_actor_damping_from_critic_floor: 0.01
  joint_diagonal_damping_floor: 0.0
  linear_solve_dtype: float64
  max_grad_norm: 0.5

  # Disabled in this gate so reward changes isolate the Paper-RAT objective
  # semantics rather than an explicit entropy regularizer.
  joint_entropy_rhs_target: 0.0
  joint_entropy_rhs_gain: 0.0
  joint_entropy_rhs_max_coef: 0.0

env_config:
  env_name: bigfish-easy-0-10
  num_envs: 16
  nsteps: 256
  norm_ret: false
  timesteps_per_proc_easy: 1_000_000
  timesteps_per_proc_hard: 100_000_000

nets_config:
  type: resnet
  norm_obs: false
  with_bn: false
  dropout: 0.0
  hidden_size: 256
  decision_hidden_size: 1024

log_config:
  log_interval: 10
  n_eval_trials: 20
